workflows:
  ios-release:
    name: iOS Release

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.softgensys.shivimart

    integrations:
      app_store_connect: Codemagic

    scripts:
      - flutter pub get

      - xcode-project use-profiles

      - flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
